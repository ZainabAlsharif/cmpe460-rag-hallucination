run_name: p3_qwen3_ragbench
model_name: Qwen/Qwen3-1.7B        # debug first with Qwen/Qwen3-0.6B
dataset: ragbench
data_dir: data/person3_zainab/ragbench
subsets: [covidqa, finqa, techqa, emanual]
max_train_samples: 8000
max_length: 2048
load_in_4bit: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
learning_rate: 2.0e-4
batch_size: 1
gradient_accumulation_steps: 16
gradient_checkpointing: true
epochs: 1
fp16: true
seed: 42
output_dir: outputs/p3_qwen3_ragbench
